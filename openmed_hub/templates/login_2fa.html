{% extends "base.html" %}
{% block title %}Second factor{% endblock %}
{% block content %}
<h1>Second factor</h1>
<p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
<form method="post" action="/login/2fa" class="card"><input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Code <input name="code" autocomplete="one-time-code" inputmode="numeric" autofocus required></label>
  <button class="btn">Verify</button>
</form>
{% endblock %}
