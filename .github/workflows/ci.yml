name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,hub]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run demo (smoke test)
        run: python examples/parkinson_decline/run_demo.py

  data-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any data-like files are tracked
        run: |
          if git ls-files | grep -iE '\.(csv|xlsx|xls|tsv|dcm|nii)(\.gz)?$|ppmi|pdbp|mrn|_data_'; then
            echo "::error::A data-like file is tracked. Remove it (see docs/DATA.md)."
            exit 1
          fi
          echo "No data-like files tracked."
